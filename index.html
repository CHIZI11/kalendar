<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Календарь</title>

  <!-- Применяем сохранённую тему до загрузки CSS (без миганий) -->
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('calendar:theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
      } catch(e) {}
    })();
  </script>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#ffffff" id="metaThemeColor"/>
</head>
<body>
  <header class="topbar">
    <button id="themeBtn" class="icon-btn" aria-label="Сменить тему" title="Сменить тему">
      <!-- Солнце (минималистичное) -->
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <g class="rays">
          <line x1="12" y1="1.5" x2="12" y2="4.2"></line>
          <line x1="12" y1="19.8" x2="12" y2="22.5"></line>
          <line x1="1.5" y1="12" x2="4.2" y2="12"></line>
          <line x1="19.8" y1="12" x2="22.5" y2="12"></line>
          <line x1="4.6" y1="4.6" x2="6.5" y2="6.5"></line>
          <line x1="17.5" y1="17.5" x2="19.4" y2="19.4"></line>
          <line x1="4.6" y1="19.4" x2="6.5" y2="17.5"></line>
          <line x1="17.5" y1="6.5" x2="19.4" y2="4.6"></line>
        </g>
      </svg>
      <!-- Луна (полная, с кратерами; такой же размер) -->
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="7.5"></circle>
        <circle cx="9.5" cy="10" r="1.2" class="crater"></circle>
        <circle cx="13.8" cy="13" r="0.9" class="crater"></circle>
        <circle cx="14.6" cy="9.2" r="0.7" class="crater"></circle>
        <circle cx="10.8" cy="14.8" r="0.8" class="crater"></circle>
      </svg>
    </button>

    <div class="month-switcher">
      <button id="prevMonth" class="icon-btn" aria-label="Предыдущий месяц" title="Предыдущий месяц">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div id="currentMonth" class="month-label" aria-live="polite"></div>
      <button id="nextMonth" class="icon-btn" aria-label="Следующий месяц" title="Следующий месяц">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <button id="menuBtn" class="icon-btn" aria-label="Меню" title="Меню">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
  </header>

  <main>
    <div id="weekdays" class="weekdays" aria-hidden="true"></div>
    <div id="calendar" class="calendar" role="grid" aria-label="Календарь"></div>
  </main>

  <!-- Подложка -->
  <div id="scrim" class="scrim" hidden></div>

  <!-- Нижнее меню (bottom sheet) -->
  <aside id="sheet" class="sheet" aria-hidden="true">
    <div class="handle" aria-hidden="true"></div>

    <section class="section">
      <h2 class="section-title">Темы</h2>
      <div class="theme-picker">
        <button class="swatch" data-theme="light" aria-label="Светлая тема" title="Светлая тема"></button>
        <button class="swatch" data-theme="theme1" aria-label="Тема 1" title="Тема 1"></button>
        <button class="swatch" data-theme="theme2" aria-label="Тема 2" title="Тема 2"></button>
        <button class="swatch" data-theme="theme3" aria-label="Тема 3" title="Тема 3"></button>
        <button class="swatch" data-theme="dark" aria-label="Тёмная тема" title="Тёмная тема"></button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Расписание</h2>
      <div class="schedule-type">
        <label><input type="radio" name="schedule" value="DNV" checked /> Д/Н/В</label>
        <label><input type="radio" name="schedule" value="2on2off" /> 2/2</label>
        <label><input type="radio" name="schedule" value="custom" /> Подробное</label>
      </div>
      <div id="weekdayRow" class="weekday-row" aria-label="Дни недели">
        <button data-w="1">Пн</button>
        <button data-w="2">Вт</button>
        <button data-w="3">Ср</button>
        <button data-w="4">Чт</button>
        <button data-w="5">Пт</button>
        <button data-w="6">Сб</button>
        <button data-w="7">Вс</button>
      </div>
    </section>

    <section class="section">
      <button id="infoToggle" class="text-btn" aria-expanded="false">Инфо</button>
      <div id="infoPanel" class="info-panel" hidden>
        <p>Календарь работает офлайн (PWA), хранит настройки на устройстве, и показывает смены <em>цветом</em>.</p>
      </div>
    </section>
  </aside>

  <script src="script.js" defer></script>
</body>
  </html>
